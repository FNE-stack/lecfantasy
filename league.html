<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEC Fantasy</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3340;
    --fg:#e6edf3; --dim:#8b98a5; --gold:#e3b341; --blue:#4493f8;
    --up:#3fb950; --down:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,'Segoe UI',system-ui,sans-serif}
  header{background:linear-gradient(180deg,#1c2330,#161b22);
    border-bottom:1px solid var(--line);padding:16px 20px}
  h1{margin:0;font-size:19px;letter-spacing:.02em}
  h1 span{color:var(--gold)}
  header .meta{color:var(--dim);font-size:12px;margin-top:4px}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 20px 60px}
  .tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--dim);
    padding:6px 13px;border-radius:6px;cursor:pointer;font-size:13px}
  .tab.on{color:var(--fg);border-color:var(--blue);background:var(--panel2)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    margin-bottom:14px;overflow:hidden}
  .card h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--dim);padding:11px 14px;border-bottom:1px solid var(--line);
    background:var(--panel2)}
  .card .body{padding:12px 14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;
    text-transform:uppercase;letter-spacing:.05em;padding:7px 10px;
    border-bottom:1px solid var(--line)}
  td{padding:8px 10px;border-bottom:1px solid #212934}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .rank{width:34px;color:var(--dim);font-variant-numeric:tabular-nums}
  .rank.r1{color:var(--gold);font-weight:700}
  .pts{font-weight:700;font-variant-numeric:tabular-nums}
  .role{display:inline-block;min-width:34px;font-size:10px;padding:1px 5px;
    border-radius:3px;background:#243040;color:var(--dim);text-align:center;
    font-weight:600;letter-spacing:.03em}
  .team{color:var(--dim);font-size:12px}
  .mgr{cursor:pointer}
  .mgr:hover td{background:var(--panel2)}
  .sub{display:none}
  .sub.on{display:table-row}
  .sub td{background:#11161d;padding:0}
  .sub table{margin:0}
  .sub th{background:#11161d}
  .empty{color:var(--dim);padding:18px 14px;text-align:center;font-size:13px}
  .badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;
    background:#243040;color:var(--dim);margin-left:7px;vertical-align:middle}
  .badge.live{background:#1f3a24;color:var(--up)}
  .badge.draft{background:#3d3014;color:var(--gold)}
  .note{background:#1a2332;border:1px solid #2d4159;border-radius:6px;
    padding:10px 13px;font-size:12px;color:#a9c4e0;margin-bottom:14px}
  .pill{font-size:11px;color:var(--dim)}
  @media(max-width:620px){ .hide-s{display:none} .wrap{padding:14px} }
</style>
</head>
<body>
<header>
  <h1><span id="lname">LEC</span> Fantasy <span class="badge" id="phase">—</span></h1>
  <div class="meta" id="meta">lädt …</div>
</header>
<div class="wrap">
  <div class="note" id="note" hidden></div>
  <div class="tabs">
    <div class="tab on" data-v="standings">Tabelle</div>
    <div class="tab" data-v="rosters">Kader</div>
    <div class="tab" data-v="players">Spieler</div>
    <div class="tab" data-v="draft">Draft</div>
  </div>
  <div id="view"></div>
</div>

<script src="scoring.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(Math.round(n*10)/10).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1});

let LEAGUE=null, PLAYERS=null, STATS=null, PIDX=new Map(), view='standings';

// cache-bust so a fresh commit shows up without a hard refresh
const bust=()=>'?t='+Math.floor(Date.now()/60000);
async function getJson(path, optional){
  try{
    const r=await fetch(path+bust(),{cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    return await r.json();
  }catch(e){
    if(optional) return null;
    throw e;
  }
}

async function boot(){
  try{
    LEAGUE=await getJson('data/league.json');
  }catch(e){
    $('meta').textContent='data/league.json fehlt oder ist kaputt.';
    return;
  }
  PLAYERS=await getJson('data/players.json',true);
  STATS =await getJson('data/stats.json',true);
  PIDX=new Map();
  if(PLAYERS&&PLAYERS.players) for(const p of PLAYERS.players) PIDX.set(p.id,p);

  $('lname').textContent=LEAGUE.name||'LEC';
  const ph=LEAGUE.draft&&LEAGUE.draft.completed?'live':(LEAGUE.phase||'draft');
  const pe=$('phase');
  pe.textContent = ph==='live'?'läuft':'Draft';
  pe.className='badge '+(ph==='live'?'live':'draft');

  const bits=[LEAGUE.split||''];
  if(PLAYERS) bits.push(PLAYERS.players.length+' Spieler');
  if(STATS)   bits.push(STATS.games.length+' Spiele erfasst');
  if(STATS&&STATS.updated) bits.push('Stand '+new Date(STATS.updated*1000).toLocaleString('de-DE'));
  $('meta').textContent=bits.filter(Boolean).join(' · ');

  if(!PLAYERS){
    const n=$('note'); n.hidden=false;
    n.innerHTML='<b>Noch keine Spielerdaten.</b> Der GitHub-Action-Job '+
      '<code>update-stats</code> füllt <code>data/players.json</code>. '+
      'Bis dahin ist der Draft-Pool leer.';
  } else if(!STATS||!STATS.games.length){
    const n=$('note'); n.hidden=false;
    n.innerHTML='<b>Noch keine Spielstatistiken.</b> Kader stehen, aber es gibt '+
      'keine Punkte — läuft der Split noch nicht, oder der Split-Name in '+
      '<code>league.json</code> passt nicht.';
  }

  document.querySelectorAll('.tab').forEach(t=>{t.onclick=()=>{
    view=t.dataset.v;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
    render();
  };});
  render();
  setInterval(refresh, 120000);   // pick up new commits every 2 min
}

async function refresh(){
  const s=await getJson('data/stats.json',true);
  const l=await getJson('data/league.json',true);
  if(s) STATS=s;
  if(l) LEAGUE=l;
  render();
}

function render(){
  if(view==='standings') return renderStandings();
  if(view==='rosters')   return renderRosters();
  if(view==='players')   return renderPlayers();
  if(view==='draft')     return renderDraft();
}

function renderStandings(){
  const rows=LECScoring.standings(LEAGUE,STATS||{games:[]},PIDX);
  if(!rows.length){ $('view').innerHTML='<div class="card"><div class="empty">Keine Manager konfiguriert.</div></div>'; return; }
  let h='<div class="card"><h2>Tabelle</h2><table><tr>'+
    '<th class="rank">#</th><th>Manager</th><th class="num hide-s">Spieler</th>'+
    '<th class="num">Punkte</th></tr>';
  rows.forEach(function(r,i){
    const filled=r.perPlayer.filter(p=>p.games>0).length;
    h+='<tr class="mgr" data-m="'+esc(r.manager)+'">'+
       '<td class="rank'+(i===0?' r1':'')+'">'+(i+1)+'</td>'+
       '<td><b>'+esc(r.name)+'</b> <span class="pill">'+r.perPlayer.length+' im Kader</span></td>'+
       '<td class="num hide-s">'+filled+'</td>'+
       '<td class="num pts">'+fmt(r.total)+'</td></tr>';
    h+='<tr class="sub" id="sub-'+esc(r.manager)+'"><td colspan="4"><table>';
    if(r.perPlayer.length){
      h+='<tr><th>Spieler</th><th class="hide-s">Team</th><th class="num">Spiele</th><th class="num">Punkte</th></tr>';
      for(const p of r.perPlayer){
        h+='<tr><td><span class="role">'+esc(p.role||'?')+'</span> '+esc(p.player)+'</td>'+
           '<td class="team hide-s">'+esc(p.team||'')+'</td>'+
           '<td class="num">'+p.games+'</td>'+
           '<td class="num pts">'+fmt(p.pts)+'</td></tr>';
      }
    } else h+='<tr><td class="empty">noch niemand gedraftet</td></tr>';
    h+='</table></td></tr>';
  });
  h+='</table></div>';
  $('view').innerHTML=h;
  document.querySelectorAll('.mgr').forEach(function(tr){tr.onclick=function(){
    const s=$('sub-'+tr.dataset.m); if(s) s.classList.toggle('on');
  };});
}

function renderRosters(){
  const ros=LECScoring.rosters(LEAGUE);
  const gp=LECScoring.byPlayer(STATS&&STATS.games);
  let h='';
  for(const m of LEAGUE.managers||[]){
    const ids=ros[m.id]||[];
    h+='<div class="card"><h2>'+esc(m.name)+'</h2><div class="body" style="padding:0">';
    if(!ids.length){ h+='<div class="empty">kein Kader</div>'; }
    else{
      h+='<table><tr><th>Slot</th><th>Spieler</th><th class="hide-s">Team</th><th class="num">Punkte</th></tr>';
      const slots=LEAGUE.roster.slots||[];
      const used=new Set();
      for(const slot of slots){
        const pid=ids.find(p=>{const mm=PIDX.get(p);return mm&&mm.role===slot&&!used.has(p);});
        if(pid) used.add(pid);
        const mm=pid?PIDX.get(pid):null;
        h+='<tr><td><span class="role">'+slot+'</span></td>'+
           '<td>'+(pid?esc(pid):'<span class="pill">frei</span>')+'</td>'+
           '<td class="team hide-s">'+(mm?esc(mm.team):'')+'</td>'+
           '<td class="num pts">'+(pid?fmt(LECScoring.playerTotal(gp.get(pid)||[],LEAGUE.scoring)):'—')+'</td></tr>';
      }
      for(const pid of ids){
        if(used.has(pid)) continue;
        const mm=PIDX.get(pid);
        h+='<tr><td><span class="role" style="background:#2a2333">BANK</span></td>'+
           '<td>'+esc(pid)+'</td><td class="team hide-s">'+(mm?esc(mm.team):'')+'</td>'+
           '<td class="num pts">'+fmt(LECScoring.playerTotal(gp.get(pid)||[],LEAGUE.scoring))+'</td></tr>';
      }
      h+='</table>';
    }
    h+='</div></div>';
  }
  $('view').innerHTML=h||'<div class="card"><div class="empty">—</div></div>';
}

function renderPlayers(){
  if(!PLAYERS){ $('view').innerHTML='<div class="card"><div class="empty">Keine Spielerdaten.</div></div>'; return; }
  const gp=LECScoring.byPlayer(STATS&&STATS.games);
  const own=LECScoring.ownership(LEAGUE);
  const mgrName={}; for(const m of LEAGUE.managers||[]) mgrName[m.id]=m.name;
  const list=PLAYERS.players.map(function(p){
    const g=gp.get(p.id)||[];
    return {p:p, games:g.length, pts:LECScoring.playerTotal(g,LEAGUE.scoring),
            owner:own.get(p.id)||null};
  }).sort((a,b)=>b.pts-a.pts||a.p.name.localeCompare(b.p.name));
  let h='<div class="card"><h2>Alle Spieler ('+list.length+')</h2><table>'+
    '<tr><th>Spieler</th><th class="hide-s">Team</th><th>Besitzer</th>'+
    '<th class="num">Spiele</th><th class="num">Punkte</th></tr>';
  for(const r of list){
    h+='<tr><td><span class="role">'+esc(r.p.role)+'</span> '+esc(r.p.name)+'</td>'+
       '<td class="team hide-s">'+esc(r.p.team)+'</td>'+
       '<td>'+(r.owner?esc(mgrName[r.owner]||r.owner):'<span class="pill">frei</span>')+'</td>'+
       '<td class="num">'+r.games+'</td>'+
       '<td class="num pts">'+fmt(r.pts)+'</td></tr>';
  }
  h+='</table></div>';
  $('view').innerHTML=h;
}

function renderDraft(){
  const d=LEAGUE.draft||{picks:[]};
  const prog=LECScoring.draftProgress(LEAGUE);
  const mgrName={}; for(const m of LEAGUE.managers||[]) mgrName[m.id]=m.name;
  const next=LECScoring.currentPicker(LEAGUE);
  let h='<div class="card"><h2>Draft — '+prog.done+'/'+prog.total+' Picks</h2><div class="body">';
  h+= next ? 'Als nächstes: <b>'+esc(mgrName[next]||next)+'</b> (Runde '+prog.round+')'
           : '<b>Draft abgeschlossen.</b>';
  h+='</div>';
  if((d.picks||[]).length){
    h+='<table><tr><th class="rank">#</th><th>Manager</th><th>Spieler</th><th class="hide-s">Team</th></tr>';
    d.picks.forEach(function(p,i){
      const mm=PIDX.get(p.player);
      h+='<tr><td class="rank">'+(i+1)+'</td><td>'+esc(mgrName[p.manager]||p.manager)+'</td>'+
         '<td>'+(mm?'<span class="role">'+esc(mm.role)+'</span> ':'')+esc(p.player)+'</td>'+
         '<td class="team hide-s">'+(mm?esc(mm.team):'')+'</td></tr>';
    });
    h+='</table>';
  } else h+='<div class="empty">noch keine Picks</div>';
  h+='</div>';
  if((LEAGUE.swaps||[]).length){
    h+='<div class="card"><h2>Wechsel</h2><table><tr><th>Manager</th><th>raus</th><th>rein</th></tr>';
    for(const s of LEAGUE.swaps){
      h+='<tr><td>'+esc(mgrName[s.manager]||s.manager)+'</td><td>'+esc(s.out)+'</td><td>'+esc(s['in'])+'</td></tr>';
    }
    h+='</table></div>';
  }
  $('view').innerHTML=h;
}

boot();
})();
</script>
</body>
</html>
