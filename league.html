<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LEC Fantasy</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3340;
    --fg:#e6edf3; --dim:#8b98a5; --gold:#e3b341; --blue:#4493f8;
    --up:#3fb950; --down:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,'Segoe UI',system-ui,sans-serif}
  header{background:linear-gradient(180deg,#1c2330,#161b22);
    border-bottom:1px solid var(--line);padding:16px 20px}
  h1{margin:0;font-size:19px;letter-spacing:.02em}
  h1 span{color:var(--gold)}
  header .meta{color:var(--dim);font-size:12px;margin-top:4px}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 20px 60px}
  .tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--dim);
    padding:6px 13px;border-radius:6px;cursor:pointer;font-size:13px}
  .tab.on{color:var(--fg);border-color:var(--blue);background:var(--panel2)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    margin-bottom:14px;overflow:hidden}
  .card h2{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--dim);padding:11px 14px;border-bottom:1px solid var(--line);
    background:var(--panel2)}
  .card .body{padding:12px 14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--dim);font-weight:600;font-size:11px;
    text-transform:uppercase;letter-spacing:.05em;padding:7px 10px;
    border-bottom:1px solid var(--line)}
  td{padding:8px 10px;border-bottom:1px solid #212934}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .rank{width:34px;color:var(--dim);font-variant-numeric:tabular-nums}
  .rank.r1{color:var(--gold);font-weight:700}
  .pts{font-weight:700;font-variant-numeric:tabular-nums}
  .role{display:inline-block;min-width:34px;font-size:10px;padding:1px 5px;
    border-radius:3px;background:#243040;color:var(--dim);text-align:center;
    font-weight:600;letter-spacing:.03em}
  .team{color:var(--dim);font-size:12px}
  .mgr{cursor:pointer}
  .mgr:hover td{background:var(--panel2)}
  .sub{display:none}
  .sub.on{display:table-row}
  .sub td{background:#11161d;padding:0}
  .sub table{margin:0}
  .sub th{background:#11161d}
  .empty{color:var(--dim);padding:18px 14px;text-align:center;font-size:13px}
  .badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;
    background:#243040;color:var(--dim);margin-left:7px;vertical-align:middle}
  .badge.live{background:#1f3a24;color:var(--up)}
  .badge.draft{background:#3d3014;color:var(--gold)}
  .note{background:#1a2332;border:1px solid #2d4159;border-radius:6px;
    padding:10px 13px;font-size:12px;color:#a9c4e0;margin-bottom:14px}
  .pill{font-size:11px;color:var(--dim)}
  .chips{display:flex;gap:5px;flex-wrap:wrap}
  .chip{font-size:11px;padding:4px 10px;border-radius:12px;background:var(--panel2);
    border:1px solid var(--line);color:var(--dim);cursor:pointer}
  .chip.on{border-color:var(--blue);color:var(--fg)}
  th.sort{cursor:pointer} th.sort.on{color:var(--fg)}
  .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
  .tgrid .card{margin:0}
  h2.th{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;
    font-size:14px;color:var(--fg)}
  h2.th span:first-of-type{flex:1}
  #modal{position:fixed;inset:0;background:rgba(1,4,9,.72);z-index:20;display:flex;
    align-items:flex-start;justify-content:center;padding:40px 12px;overflow-y:auto}
  #modal[hidden]{display:none}
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    width:100%;max-width:680px;position:relative;overflow:hidden}
  .pcard .x{position:absolute;top:8px;right:10px;background:none;border:0;color:var(--dim);
    font-size:24px;cursor:pointer}
  .phead{display:flex;gap:16px;align-items:center;padding:18px 18px 12px}
  .phead .big{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:top;
    background:#243040}
  .pn{font-size:21px;font-weight:700}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .kpis div{background:var(--panel2);padding:9px 12px;font-size:11px;color:var(--dim)}
  .kpis b{display:block;font-size:16px;color:var(--fg);font-variant-numeric:tabular-nums}
  .glog{max-height:52vh;overflow-y:auto}
  .wl{font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px}
  .wl.w{background:#1f3a24;color:var(--up)} .wl.l{background:#3a1f22;color:var(--down)}
  @media(max-width:620px){ .tgrid{grid-template-columns:1fr} .phead .big{width:64px;height:64px} }
  @media(max-width:620px){ .hide-s{display:none} .wrap{padding:14px} }
</style>
</head>
<body>
<header>
  <h1><span id="lname">LEC Fantasy</span> <span class="badge" id="phase">—</span></h1>
  <div class="meta" id="meta">lädt …</div>
</header>
<div class="wrap">
  <div class="note" id="note" hidden></div>
  <div class="tabs">
    <div class="tab on" data-v="standings">Tabelle</div>
    <div class="tab" data-v="rosters">Kader</div>
    <div class="tab" data-v="players">Spieler</div>
    <div class="tab" data-v="teams">Teams</div>
    <div class="tab" data-v="draft">Draft</div>
  </div>
  <div id="view"></div>
</div>
<div id="modal" hidden></div>

<script src="scoring.js"></script>
<script src="common.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const U=window.LECUI, S=window.LECScoring, esc=U.esc, fmt=U.fmt;

let D=null, view='standings', sortKey='pts', roleFilter='';

async function boot(){
  try{ D=await U.load(); }
  catch(e){ $('meta').textContent='data/league.json fehlt oder ist kaputt.'; return; }
  header();
  document.querySelectorAll('.tab').forEach(t=>{t.onclick=()=>{
    view=t.dataset.v;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
    render();
  };});
  $('modal').onclick=e=>{ if(e.target.id==='modal'||e.target.dataset.close!==undefined) closeCard(); };
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeCard(); });
  render();
  setInterval(async()=>{ try{ D=await U.load(); header(); render(); }catch(e){} }, 120000);
}

function header(){
  const L=D.league;
  $('lname').textContent=L.name||'LEC Fantasy';
  const live=L.draft&&L.draft.completed;
  const pe=$('phase'); pe.textContent=live?'läuft':'Draft'; pe.className='badge '+(live?'live':'draft');
  const bits=[];
  if(D.stats.tournament) bits.push(D.stats.tournament.replace(/_/g,' ').toUpperCase());
  bits.push(D.players.players.length+' Spieler');
  bits.push(new Set(D.stats.games.map(g=>g.game)).size+' Spiele');
  if(D.stats.updated) bits.push('Stand '+new Date(D.stats.updated*1000).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}));
  $('meta').textContent=bits.join(' · ');
  if(D.league.draft&&!D.league.draft.completed){
    const n=$('note'); n.hidden=false;
    n.innerHTML='Draft läuft gerade? Picken geht auf <a href="pick.html">pick.html</a>. '+
      'Die Punkte unten stammen aus dem zuletzt gespielten Split.';
  } else $('note').hidden=true;
}

function render(){
  ({standings:renderStandings, rosters:renderRosters, players:renderPlayers,
    teams:renderTeams, draft:renderDraft})[view]();
  document.querySelectorAll('a.plink').forEach(a=>a.onclick=e=>{ e.preventDefault(); openCard(a.dataset.pid); });
}

function mgrName(id){ const m=(D.league.managers||[]).find(x=>x.id===id); return m?m.name:id; }

function renderStandings(){
  const rows=S.standings(D.league,D.stats,D.P);
  if(!rows.length){ $('view').innerHTML='<div class="card"><div class="empty">Keine Manager konfiguriert.</div></div>'; return; }
  let h='<div class="card"><h2>Tabelle</h2><table><tr><th class="rank">#</th><th>Manager</th>'+
        '<th class="num hide-s">Kader</th><th class="num">Punkte</th></tr>';
  rows.forEach((r,i)=>{
    h+='<tr class="mgr" data-m="'+esc(r.manager)+'"><td class="rank'+(i===0?' r1':'')+'">'+(i+1)+'</td>'+
       '<td><b>'+esc(r.name)+'</b></td><td class="num hide-s">'+r.perPlayer.length+'</td>'+
       '<td class="num pts">'+fmt(r.total)+'</td></tr>';
    h+='<tr class="sub" id="sub-'+esc(r.manager)+'"><td colspan="4"><table>';
    if(r.perPlayer.length){
      h+='<tr><th>Spieler</th><th class="num">Spiele</th><th class="num">Punkte</th></tr>';
      for(const p of r.perPlayer)
        h+='<tr><td>'+U.playerCell(D,p.player,{link:true})+'</td><td class="num">'+p.games+'</td>'+
           '<td class="num pts">'+fmt(p.pts)+'</td></tr>';
    } else h+='<tr><td class="empty">noch niemand gedraftet</td></tr>';
    h+='</table></td></tr>';
  });
  $('view').innerHTML=h+'</table></div>';
  document.querySelectorAll('.mgr').forEach(tr=>tr.onclick=()=>{ const s=$('sub-'+tr.dataset.m); if(s) s.classList.toggle('on'); });
}

function renderRosters(){
  const ros=S.rosters(D.league);
  let h='';
  for(const m of D.league.managers||[]){
    const ids=ros[m.id]||[];
    let total=0;
    let body='';
    const used=new Set();
    for(const slot of D.league.roster.slots||[]){
      const pid=ids.find(p=>{const mm=D.P.get(p);return mm&&mm.role===slot&&!used.has(p);});
      if(pid) used.add(pid);
      const se=pid?U.playerSeason(D,pid):null; if(se) total+=se.pts;
      body+='<tr><td>'+(pid?U.playerCell(D,pid,{photo:true,link:true}):'<span class="role">'+slot+'</span> <span class="pill">frei</span>')+'</td>'+
            '<td class="num pts">'+(se?fmt(se.pts):'—')+'</td></tr>';
    }
    for(const pid of ids){
      if(used.has(pid)) continue;
      const se=U.playerSeason(D,pid); total+=se.pts;
      body+='<tr><td><span class="role" style="background:#2a2333">BANK</span> '+U.playerCell(D,pid,{photo:true,link:true})+'</td>'+
            '<td class="num pts">'+fmt(se.pts)+'</td></tr>';
    }
    h+='<div class="card"><h2>'+esc(m.name)+' — '+fmt(total)+' Punkte</h2>'+
       (ids.length?'<table>'+body+'</table>':'<div class="empty">kein Kader</div>')+'</div>';
  }
  $('view').innerHTML=h;
}

function renderPlayers(){
  const own=S.ownership(D.league);
  let list=D.players.players.map(p=>({p,s:U.playerSeason(D,p.id),owner:own.get(p.id)||null}));
  if(roleFilter) list=list.filter(r=>r.p.role===roleFilter);
  const key={pts:r=>r.s.pts, avg:r=>r.s.avg, kda:r=>(r.s.k+r.s.a)/Math.max(1,r.s.d), games:r=>r.s.games}[sortKey];
  list.sort((a,b)=>key(b)-key(a)||a.p.name.localeCompare(b.p.name));
  const chips=['',...(D.league.roster.slots||[])].map(r=>'<span class="chip'+(roleFilter===r?' on':'')+'" data-role="'+r+'">'+(r||'Alle')+'</span>').join('');
  const th=(k,l)=>'<th class="num sort'+(sortKey===k?' on':'')+'" data-k="'+k+'">'+l+'</th>';
  let h='<div class="card"><h2>Alle Spieler ('+list.length+')</h2><div class="body"><div class="chips">'+chips+'</div></div>'+
        '<table><tr><th>Spieler</th><th class="hide-s">Besitzer</th>'+th('games','Sp.')+
        '<th class="num hide-s">K/D/A</th>'+th('kda','KDA')+th('avg','Ø')+th('pts','Punkte')+'</tr>';
  for(const r of list){
    const s=r.s, g=Math.max(1,s.games);
    h+='<tr><td>'+U.playerCell(D,r.p.id,{photo:true,link:true,real:true})+'</td>'+
       '<td class="hide-s">'+(r.owner?esc(mgrName(r.owner)):'<span class="pill">frei</span>')+'</td>'+
       '<td class="num">'+s.games+'</td>'+
       '<td class="num hide-s">'+(s.k/g).toFixed(1)+'/'+(s.d/g).toFixed(1)+'/'+(s.a/g).toFixed(1)+'</td>'+
       '<td class="num">'+((s.k+s.a)/Math.max(1,s.d)).toFixed(1)+'</td>'+
       '<td class="num">'+fmt(s.avg)+'</td><td class="num pts">'+fmt(s.pts)+'</td></tr>';
  }
  $('view').innerHTML=h+'</table></div>';
  document.querySelectorAll('.chip[data-role]').forEach(c=>c.onclick=()=>{roleFilter=c.dataset.role;render();});
  document.querySelectorAll('th.sort').forEach(c=>c.onclick=()=>{sortKey=c.dataset.k;render();});
}

function renderTeams(){
  const own=S.ownership(D.league);
  let h='<div class="tgrid">';
  for(const t of D.teams.teams){
    const ps=D.players.players.filter(p=>p.team===t.code);
    // series record from the game rows: one W/L per game for the team
    const games={}; for(const g of D.stats.games) if(g.team===t.code) games[g.game]=g.win;
    const w=Object.values(games).filter(Boolean).length, l=Object.keys(games).length-w;
    h+='<div class="card"><h2 class="th">'+U.teamLogo(D,t.code,30)+' <span>'+esc(t.name)+'</span>'+
       '<span class="pill">'+esc(t.code)+' · '+w+'–'+l+'</span></h2><table>';
    for(const p of ps){
      const se=U.playerSeason(D,p.id);
      h+='<tr><td>'+U.playerCell(D,p.id,{photo:true,link:true,real:true})+
         (own.get(p.id)?' <span class="pill">'+esc(mgrName(own.get(p.id)))+'</span>':'')+'</td>'+
         '<td class="num pts">'+fmt(se.pts)+'</td></tr>';
    }
    h+='</table></div>';
  }
  $('view').innerHTML=h+'</div>';
}

function renderDraft(){
  const d=D.league.draft||{picks:[]};
  const prog=S.draftProgress(D.league);
  const next=S.currentPicker(D.league);
  let h='<div class="card"><h2>Draft — '+prog.done+'/'+prog.total+' Picks</h2><div class="body">'+
        (next?'Als nächstes: <b>'+esc(mgrName(next))+'</b> (Runde '+prog.round+') · <a href="pick.html">zum Draft</a>'
             :'<b>Draft abgeschlossen.</b>')+'</div>';
  if((d.picks||[]).length){
    h+='<table><tr><th class="rank">#</th><th>Manager</th><th>Spieler</th></tr>';
    d.picks.forEach((p,i)=>{
      h+='<tr><td class="rank">'+(i+1)+'</td><td>'+esc(mgrName(p.manager))+'</td><td>'+U.playerCell(D,p.player,{link:true})+'</td></tr>';
    });
    h+='</table>';
  } else h+='<div class="empty">noch keine Picks</div>';
  h+='</div>';
  if((D.league.swaps||[]).length){
    h+='<div class="card"><h2>Wechsel</h2><table><tr><th>Manager</th><th>raus</th><th>rein</th></tr>';
    for(const s of D.league.swaps)
      h+='<tr><td>'+esc(mgrName(s.manager))+'</td><td>'+U.playerCell(D,s.out)+'</td><td>'+U.playerCell(D,s['in'])+'</td></tr>';
    h+='</table></div>';
  }
  $('view').innerHTML=h;
}

// ── player card ─────────────────────────────────────────────────────────
function openCard(pid){
  const p=D.P.get(pid); if(!p) return;
  const se=U.playerSeason(D,pid), t=D.T.get(p.team);
  const owner=S.ownership(D.league).get(pid);
  // opponent per game = the other team in the same game id
  const opp={}; for(const g of D.stats.games) if(g.team!==p.team) opp[g.game]=g.team;
  const g=Math.max(1,se.games);
  let h='<div class="pcard"><button class="x" data-close>×</button>'+
    '<div class="phead">'+(p.photo?'<img class="big" src="'+esc(p.photo)+'" alt="">':'')+
    '<div><div class="pn">'+esc(p.name)+'</div><div class="real">'+esc(p.realName||'')+'</div>'+
    '<div style="margin-top:6px">'+U.teamLogo(D,p.team,22)+' '+esc(t?t.name:p.team)+' · <span class="role">'+esc(p.role)+'</span></div>'+
    '<div class="pill" style="margin-top:4px">'+(owner?'gehört '+esc(mgrName(owner)):'frei')+'</div></div></div>'+
    '<div class="kpis"><div><b>'+fmt(se.pts)+'</b>Punkte</div><div><b>'+fmt(se.avg)+'</b>Ø/Spiel</div>'+
    '<div><b>'+se.games+'</b>Spiele</div><div><b>'+se.wins+'–'+(se.games-se.wins)+'</b>W–L</div>'+
    '<div><b>'+(se.k/g).toFixed(1)+'/'+(se.d/g).toFixed(1)+'/'+(se.a/g).toFixed(1)+'</b>Ø K/D/A</div>'+
    '<div><b>'+Math.round(se.cs/g)+'</b>Ø CS</div></div>';
  if(se.rows.length){
    h+='<div class="glog"><table><tr><th>Datum</th><th>Gegner</th><th>Champ</th><th class="num">K/D/A</th>'+
       '<th class="num hide-s">CS</th><th></th><th class="num">Pkt</th></tr>';
    for(const r of se.rows.slice().reverse()){
      const o=opp[r.game];
      h+='<tr><td class="team">'+r.ts.slice(5,10).split('-').reverse().join('.')+' #'+r.n+'</td>'+
         '<td>'+(o?U.teamLogo(D,o,18)+' '+esc(o):'')+'</td>'+
         '<td>'+U.champIcon(D,r.champ,22)+' <span class="hide-s">'+esc((D.champs.names||{})[r.champ]||r.champ)+'</span></td>'+
         '<td class="num">'+r.k+'/'+r.d+'/'+r.a+'</td><td class="num hide-s">'+r.cs+'</td>'+
         '<td><span class="wl '+(r.win?'w':'l')+'">'+(r.win?'W':'L')+'</span></td>'+
         '<td class="num pts">'+fmt(S.gamePoints(r,D.league.scoring))+'</td></tr>';
    }
    h+='</table></div>';
  } else h+='<div class="empty">keine Spiele in diesem Split</div>';
  $('modal').innerHTML=h+'</div>';
  $('modal').hidden=false;
  document.body.style.overflow='hidden';
}
function closeCard(){ $('modal').hidden=true; $('modal').innerHTML=''; document.body.style.overflow=''; }

boot();
})();
</script>
</body>
</html>
