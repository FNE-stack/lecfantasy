name: update-stats

# Pulls LEC teams, rosters, logos and per-game player stats from the lolesports
# API and commits data/teams.json, data/players.json, data/stats.json.
# Needs no secrets: the lolesports API answers without a login.
# Incremental - games already in stats.json are not fetched again.
on:
  schedule:
    # 04:20 and 16:20 UTC - after EU match days finish
    - cron: '20 4,16 * * *'
  workflow_dispatch:
    inputs:
      tournament:
        description: 'lolesports tournament slug, e.g. lec_split_3_2026 (blank = league.json, usually "auto")'
        required: false
        default: ''

permissions:
  contents: write

# Never let two runs race each other on the same files.
concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch from lolesports
        env:
          TOURNAMENT: ${{ github.event.inputs.tournament }}
        run: |
          if [ -n "$TOURNAMENT" ]; then
            python scripts/fetch_lolesports.py --tournament "$TOURNAMENT"
          else
            python scripts/fetch_lolesports.py
          fi

      - name: Commit if changed
        run: |
          git config user.name  'lec-fantasy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/teams.json data/players.json data/stats.json data/champions.json data/schedule.json
          if git diff --staged --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "stats: $(python -c "import json;print(json.load(open('data/stats.json'))['tournament'])") [skip ci]"
          # the draft Worker may have committed league.json meanwhile; our files
          # don't overlap with it, so a rebase is always clean
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && break
            sleep 5
          done
